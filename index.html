<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXIMUM REALITY</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Press Start 2P', cursive; overflow: hidden; }
        .arcade-container { position: relative; width: 95vw; max-width: 800px; }
        
        .cabinet-shell { width: 100%; display: block; position: relative; z-index: 10; pointer-events: none; }

        .screen {
            position: absolute;
            top: 36.2%; left: 17.5%; width: 65%; height: 35.8%;
            background: #000; overflow: hidden; border-radius: 8px; z-index: 1;
        }

        /* Moving the video wrapper to a higher layer initially to force load */
        .video-wrapper {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
        }

        iframe { 
            width: 100%; height: 100%; border: none; 
            transform: scale(1.6);
            /* This helps mobile browsers see the video clearly */
            opacity: 0.8; 
        }

        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 4px; z-index: 5; pointer-events: none;
        }

        .credits-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            z-index: 20;
            animation: scrollUp 15s linear infinite;
        }

        .arcade-link {
            color: #00ff00; text-decoration: none; font-size: 0.6rem;
            margin: 20px 0; text-align: center;
            text-shadow: 2px 2px #000, 0 0 10px #00ff00;
            display: block;
        }

        @keyframes scrollUp { 0% { transform: translateY(110%); } 100% { transform: translateY(-160%); } }
    </style>
</head>
<body>

<div class="arcade-container">
    <img src="arcade.PNG" class="cabinet-shell">
    <div class="screen">
        <div class="video-wrapper">
            <iframe id="arcadeVideo"
                    src="https://www.youtube.com/embed/Y5x8DP7FE2U?autoplay=1&mute=1&loop=1&playlist=Y5x8DP7FE2U&controls=0&modestbranding=1&rel=0&playsinline=1&enablejsapi=1&widget_referrer=https://github.com" 
                    allow="autoplay; encrypted-media; picture-in-picture" 
                    allowfullscreen>
            </iframe>
        </div>
        <div class="scanlines"></div>
        <div class="credits-container">
            <a href="#" class="arcade-link">1P: MAIN HUB</a>
            <a href="#" class="arcade-link">2P: PROJECT VAULT</a>
            <a href="#" class="arcade-link">HIGH SCORE: BLOG</a>
            <a href="#" class="arcade-link">EXIT: CONTACT</a>
        </div>
    </div>
</div>

</body>
</html>
