<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXIMUM REALITY</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Press Start 2P', cursive; overflow: hidden; }
        .arcade-container { position: relative; width: 95vw; max-width: 800px; }
        .cabinet-shell { width: 100%; display: block; position: relative; z-index: 50; pointer-events: none; }
        .screen { position: absolute; top: 36.2%; left: 17.5%; width: 65%; height: 35.8%; background: #000; overflow: hidden; border-radius: 8px; z-index: 1; }
        
        .video-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; opacity: 0.7; }
        iframe { width: 100%; height: 100%; border: none; transform: scale(1.6); }

        /* THE START OVERLAY */
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 150;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; color: #ff00ff; font-size: 1rem;
            text-shadow: 0 0 10px #ff00ff;
            animation: blink 0.8s infinite;
        }

        .credits-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; z-index: 100; animation: scrollUp 15s linear infinite; }
        .arcade-link { color: #00ff00; text-decoration: none; font-size: 0.6rem; margin: 20px 0; text-align: center; text-shadow: 2px 2px #000, 0 0 10px #00ff00; display: block; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes scrollUp { 0% { transform: translateY(110%); } 100% { transform: translateY(-160%); } }
    </style>
</head>
<body>

<div class="arcade-container">
    <div id="start-overlay" onclick="startGame()">INSERT COIN / START</div>
    
    <img src="arcade.PNG" class="cabinet-shell">
    <div class="screen">
        <div class="video-wrapper">
            <iframe id="arcadeVideo" 
                    src="https://www.youtube.com/embed/Y5x8DP7FE2U?enablejsapi=1&autoplay=1&mute=1&loop=1&playlist=Y5x8DP7FE2U&controls=0&modestbranding=1&rel=0&playsinline=1" 
                    allow="autoplay; encrypted-media"></iframe>
        </div>
        <div class="credits-container">
            <a href="#" class="arcade-link">1P: MAIN HUB</a>
            <a href="#" class="arcade-link">2P: PROJECT VAULT</a>
            <a href="#" class="arcade-link">HIGH SCORE: BLOG</a>
            <a href="#" class="arcade-link">EXIT: CONTACT</a>
        </div>
    </div>
</div>

<script>
    function startGame() {
        // Remove the overlay
        document.getElementById('start-overlay').style.display = 'none';
        
        // Command the YouTube player to play (requires JS API)
        var iframe = document.getElementById('arcadeVideo');
        iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    }
</script>

</body>
</html>
