<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXIMUM REALITY</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Press Start 2P', cursive; overflow: hidden; }
        .arcade-container { position: relative; width: 95vw; max-width: 800px; }
        
        /* THE CABINET FRAME */
        .cabinet-shell { width: 100%; display: block; position: relative; z-index: 50; pointer-events: none; }

        /* THE SCREEN */
        .screen {
            position: absolute;
            top: 36.2%; left: 17.5%; width: 65%; height: 35.8%;
            background: #000; overflow: hidden; border-radius: 8px; z-index: 1;
        }

        /* LOCAL VIDEO - MATCHING: maximum_intro.mp4 */
        .intro-video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.65;
            z-index: 5;
        }

        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px; z-index: 10; pointer-events: none;
        }

        /* THE LINKS */
        .credits-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            z-index: 100;
            animation: scrollUp 15s linear infinite;
        }

        .credits-container:hover { animation-play-state: paused; }

        .arcade-link {
            color: #00ff00; text-decoration: none; font-size: 0.6rem;
            margin: 20px 0; text-align: center;
            text-shadow: 2px 2px #000, 0 0 10px #00ff00;
            display: block; pointer-events: auto;
        }

        .arcade-link:hover { color: #fff; text-shadow: 0 0 15px #fff; }

        @keyframes scrollUp { 0% { transform: translateY(110%); } 100% { transform: translateY(-160%); } }
    </style>
</head>
<body>

<div class="arcade-container">
    <img src="arcade.PNG" class="cabinet-shell">
    <div class="screen">
        <video class="intro-video" autoplay muted loop playsinline>
            <source src="maximum_intro.mp4" type="video/mp4">
        </video>
        
        <div class="scanlines"></div>
        
        <div class="credits-container">
            <a href="#" target="_blank" class="arcade-link">1P: MAIN HUB</a>
            <a href="#" target="_blank" class="arcade-link">2P: PROJECT VAULT</a>
            <a href="#" target="_blank" class="arcade-link">HIGH SCORE: BLOG</a>
            <a href="#" target="_blank" class="arcade-link">EXIT: CONTACT</a>
        </div>
    </div>
</div>

</body>
</html>
