<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXIMUM REALITY</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
        }

        .arcade-container {
            position: relative;
            width: 95vw;
            max-width: 800px;
        }

        /* 1. THE CABINET (Ensuring it shows up) */
        .cabinet-shell {
            width: 100%;
            height: auto;
            display: block;
            position: relative;
            z-index: 20; /* Moves the frame to the very front */
            pointer-events: none; 
        }

        /* 2. THE SCREEN */
        .screen {
            position: absolute;
            top: 36%; 
            left: 17%;
            width: 66%;
            height: 36%;
            background: #111; /* Fallback color so it's not pure black */
            overflow: hidden;
            z-index: 1; /* Sits behind the frame */
        }

        /* 3. THE VIDEO */
        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.5;
            z-index: 2;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            transform: scale(1.5); /* Zoom to fill screen */
        }

        /* 4. THE LINKS (Ensuring they stay visible) */
        .credits-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 30; /* Moves links to the very top */
            animation: scrollUp 15s linear infinite;
        }

        .credits-container:hover {
            animation-play-state: paused;
        }

        .arcade-link {
            color: #00ff00;
            text-decoration: none;
            font-size: 0.6rem;
            margin: 20px 0;
            text-align: center;
            text-shadow: 2px 2px #000, 0 0 5px #00ff00;
            display: block;
        }

        @keyframes scrollUp {
            0% { transform: translateY(100%); }
            100% { transform: translateY(-130%); }
        }
    </style>
</head>
<body>

<div class="arcade-container">
    <img src="arcade.PNG" class="cabinet-shell" onerror="this.style.border='5px solid red'; console.log('Image failed to load');">

    <div class="screen">
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/Y5x8DP7FE2U?autoplay=1&mute=1&loop=1&playlist=Y5x8DP7FE2U&controls=0&modestbranding=1&rel=0" 
                    allow="autoplay; encrypted-media">
            </iframe>
        </div>
        
        <div class="credits-container">
            <a href="#" target="_blank" class="arcade-link">1P: MAIN HUB</a>
            <a href="#" target="_blank" class="arcade-link">2P: PROJECTS</a>
            <a href="#" target="_blank" class="arcade-link">HIGH SCORE: BLOG</a>
            <a href="#" target="_blank" class="arcade-link">EXIT: CONTACT</a>
        </div>
    </div>
</div>

</body>
</html>
