<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXIMUM REALITY</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Press Start 2P', cursive;
            color: #fff;
            overflow: hidden;
        }

        .arcade-container {
            position: relative;
            width: 100%;
            max-width: 800px;
        }

        .cabinet-shell {
            width: 100%;
            display: block;
            position: relative;
            z-index: 10;
            pointer-events: none; 
        }

        .screen {
            position: absolute;
            top: 36.2%; 
            left: 17.5%;
            width: 65%;
            height: 35.8%;
            background: #000;
            overflow: hidden;
            border-radius: 8px;
            z-index: 1;
        }

        /* YouTube Container */
        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.6; /* Blends the video into the cabinet */
            z-index: 2;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            /* Zooming slightly to fill the rectangular arcade screen */
            transform: scale(1.4); 
        }

        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            z-index: 11;
            pointer-events: none;
        }

        .credits-container {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            z-index: 15;
            animation: scrollUp 15s linear infinite;
        }

        .credits-container:hover {
            animation-play-state: paused;
        }

        .arcade-link {
            color: #00ff00;
            text-decoration: none;
            font-size: 0.65rem;
            margin: 25px 0;
            text-align: center;
            text-shadow: 2px 2px #000, 0 0 8px #00ff00;
            transition: all 0.2s;
            display: block;
            pointer-events: auto;
        }

        .arcade-link:hover {
            color: #fff;
            transform: scale(1.1);
            text-shadow: 0 0 15px #fff;
        }

        @keyframes scrollUp {
            0% { transform: translateY(110%); }
            100% { transform: translateY(-150%); }
        }

        @keyframes flicker {
            0% { opacity: 0.98; }
            100% { opacity: 1; }
        }
        .screen { animation: flicker 0.15s infinite; }
    </style>
</head>
<body>

<div class="arcade-container">
    <img src="arcade.PNG" class="cabinet-shell">

    <div class="screen">
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/Y5x8DP7FE2U?autoplay=1&mute=1&loop=1&playlist=Y5x8DP7FE2U&controls=0&modestbranding=1&rel=0&iv_load_policy=3" 
                    allow="autoplay; encrypted-media">
            </iframe>
        </div>

        <div class="scanlines"></div>
        
        <div class="credits-container">
            <a href="https://github.com/yourusername" target="_blank" class="arcade-link">1P: MAIN HUB</a>
            <a href="#" target="_blank" class="arcade-link">2P: PROJECT VAULT</a>
            <a href="#" target="_blank" class="arcade-link">HIGH SCORE: BLOG</a>
            <a href="#" target="_blank" class="arcade-link">BONUS: CREATIONS</a>
            <a href="#" target="_blank" class="arcade-link">EXIT: CONTACT</a>
        </div>
    </div>
</div>

</body>
</html>
